# ==============================================================================
# Container-internal nginx — serves the built SPA.
#
# The host's own nginx (on the VPS) terminates TLS and reverse-proxies
# app.autofish.online to this container; this config only needs to handle the
# SPA routing and caching, not certificates or the domain name.
# ==============================================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # HTML is never cached — a deploy must be visible on the next load, not
  # stuck behind a stale cached shell that references assets which no
  # longer exist.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Hashed build assets (Vite fingerprints the filename on every build) are
  # safe to cache forever — a new deploy ships new filenames, never reuses
  # old ones.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
